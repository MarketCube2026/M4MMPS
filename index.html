<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>学术会议策划小助手</title>
    <style>
      body {
        margin: 0;
        font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
        background: #f5f7f9;
        color: #202833;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 56px 24px;
      }
      .hero {
        background: #fff;
        border: 1px solid #d8dee6;
        border-radius: 10px;
        padding: 34px;
        box-shadow: 0 14px 36px rgba(32, 40, 51, 0.08);
      }
      h1 {
        margin: 0 0 12px;
        color: #0f5369;
        font-size: 30px;
      }
      p {
        line-height: 1.8;
        color: #4b5968;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 22px;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding: 0 16px;
        border-radius: 6px;
        text-decoration: none;
        border: 1px solid #176b87;
        color: #176b87;
        font-weight: 700;
      }
      a.primary {
        background: #176b87;
        color: #fff;
      }
      .note {
        margin-top: 22px;
        padding: 14px 16px;
        border-radius: 8px;
        background: #eef4f6;
        color: #31414f;
      }
      code {
        background: #edf1f4;
        padding: 2px 5px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>学术会议策划小助手</h1>
        <p>
          面向市场部会议策划场景，支持填写会议需求、生成会议日程、维护参会嘉宾、编辑时间安排，并导出 Excel。
        </p>
        <p>
          完整功能包含 React 前端、FastAPI 后端、SQLite 数据库和 openpyxl Excel 导出。由于 GitHub Pages 只能托管静态页面，完整应用请下载仓库后按 README 在本地启动。
        </p>
        <div class="actions">
          <a class="primary" href="https://github.com/MarketCube2026/M4MMPS">访问 GitHub 仓库</a>
          <a href="https://github.com/MarketCube2026/M4MMPS/archive/refs/heads/main.zip">下载完整项目 ZIP</a>
        </div>
        <div class="note">
          本地启动：先运行 <code>backend</code> 的 FastAPI 服务，再运行 <code>frontend</code> 的 Vite 前端服务。详细步骤见仓库 README。
        </div>
      </section>
    </main>
  </body>
</html>
